services:
  db:
    image: postgres:16
    container_name: todo-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: todo_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  api:
    build: .
    container_name: todo-api
    env_file:
      - .env
    ports:
      - "8080:8000"
    depends_on:
      - db
    restart: always

volumes:
  postgres_data: